# Countries with two independent external ground truths.
#
#   lat/lon   -> great-circle distance between capitals (kilometres)
#   language  -> family / branch / sub-branch of the dominant national language,
#                a standard proxy for cultural distance in the economics and
#                typology literature
#   gdp       -> GDP per capita, nominal USD, APPROXIMATE, around 2023. These are
#                rounded order-of-magnitude figures, not an authoritative series;
#                Cuba in particular is uncertain. Economic distance is computed as
#                |log10 gdp_i - log10 gdp_j| and the Mantel test is rank-based, so
#                only the rough ordering has to be right.
#   population -> millions, approximate, ~2023. Included because it is the main
#                driver of most 'national power' indices and is far more reliably
#                known than any composite index.
#
# Honest caveats:
# * Linguistic distance is a PROXY for cultural distance, not a measurement of it.
#   Hofstede-style indices would be an alternative; language family has the
#   advantage that it is checkable rather than remembered.
# * For several countries the "dominant language" is contestable -- Nigeria,
#   South Africa and Ireland all have an official language that differs from the
#   most-spoken first language. The choice made here is noted inline.
# * Geography and language are themselves correlated (neighbours tend to be
#   related), so the two ground truths are not independent of each other. The
#   figure reports the correlation BETWEEN them so that is visible.

ranks: [family, branch, subbranch]

templates:
  - "I travelled to {} last year."
  - "The news report came from {}."
  - "There is a photograph of {}."

