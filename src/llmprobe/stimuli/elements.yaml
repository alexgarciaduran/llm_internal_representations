# Chemical elements, with the only genuinely TWO-DIMENSIONAL ground truth here.
#
# Every other concept in this repo has a 1-D scale (temperature, GDP), a circle
# (hue) or a tree (taxonomy, language). The periodic table is a lattice: each
# element has a period (row) and a group (column), and both carry real meaning --
# group predicts chemical behaviour, period predicts size and shell structure.
#
# So the question is sharper than before: does a model that has only read about
# chemistry recover the TABLE, or just the ordering by atomic number?
#
# Lanthanides and actinides are left out: they have no standard group, so the
# lattice would be undefined for them.
#
# Templates force the chemical reading. Several element names are polysemous in
# English -- lead, tin, mercury, gold, silver, carbon -- and a bare name would
# measure the wrong sense.

templates:
  - "A sample of pure {} was analysed in the laboratory."
  - "The element {} appears in the periodic table."
  - "They measured the density of {}."

# name: [atomic_number, period, group, block, category]
