# Organisms with a five-level hierarchy, used as an external graded ground truth.
#
# distance = 5 - (number of leading ranks two organisms share)
#   0 dog-wolf (same group)        3 dog-mushroom (same supergroup)
#   1 dog-mouse (same class)       4 dog-oak      (same domain)
#   2 dog-eagle (same kingdom)     5 dog-bacterium (different domain)
#
# The supergroup rank is the interesting one: **Opisthokonta contains animals and
# fungi**, which really are sister groups, so a mushroom is genetically closer to
# a dog than an oak is. Archaeplastida covers land plants and green/red algae.
# This is a coarse proxy for genetic distance -- shared-rank depth correlates with
# divergence time without being linear in it.
#
# Two honest simplifications: "protist" is a paraphyletic convenience grouping,
# not a clade; and cetaceans are kept separate from the other ungulates, which is
# the traditional split rather than the modern phylogeny.

ranks: [domain, supergroup, kingdom, class, group]

templates:
  - "The {} was near the river."
  - "I photographed the {} yesterday."
  - "There is a picture of the {}."

