# 30 meanings x 6 languages, grouped into 6 semantic topics.
#
# Each sentence carries three labels at once -- language, meaning, topic -- so the
# same points can be asked three questions: is this layer sorting by surface form,
# by exact translation equivalence, or by semantic field?
#
# All six languages use the Latin script on purpose. Mixing in another script
# would make "which language is this?" answerable from the raw bytes.

languages:
- en
- es
- fr
- de
- it
- pt
