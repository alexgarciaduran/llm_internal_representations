# Body parts: is there a spatial layout of the body in there?
#
# The ground truth is a vertical coordinate, 0 at the crown and 1 at the toes,
# plus two categorical properties:
#
#   internal  organs and bones, against surfaces and features
#   paired    two of them (eyes, lungs, hands) against one (heart, nose, spine)
#
# This set is ~90 parts rather than the obvious ~40, because at n = 40 nothing
# fine-grained in this repo has survived replication.
#
# CAVEAT, stated plainly: unlike the periodic table or the NRC lexicon, this
# ground truth is one I wrote. The vertical coordinates are approximate and the
# ordering within a region (which of liver and stomach is higher) is arguable.
# Only the coarse ordering should be taken seriously.
#
# Parts with no location -- skin, blood, muscle, nerve, bone -- are excluded,
# since a vertical coordinate would be meaningless for them.
#
# Templates force the anatomical sense. Many of these names have commoner
# non-body meanings in English: palm, sole, temple, nail, arch, trunk, calf.

templates:
  - "The doctor carefully examined the patient's {}."
  - "She felt a sharp pain in her {}."
  - "The anatomy textbook described the {} in detail."

# name: [vertical 0-1, internal, paired, region]
